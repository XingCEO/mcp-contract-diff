[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-contract-diff"
version = "0.1.0"
description = "Catch tool-contract breaks before an agent discovers them at runtime."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "XingCEO"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
mcp-contract-diff = "mcp_contract_diff:main"

[project.urls]
Repository = "https://github.com/XingCEO/mcp-contract-diff"
Issues = "https://github.com/XingCEO/mcp-contract-diff/issues"

[tool.setuptools]
py-modules = ["mcp_contract_diff"]
